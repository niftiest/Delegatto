name: Release

# Push a tag like v1.2.3 (matching package.json "version") to build and publish
# a GitHub Release with the installer, the portable exe and the update feed
# (latest.yml) that installed copies of Delegatto check for updates.
# "Run workflow" builds the same files without publishing (downloadable as an
# artifact), for testing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npx tsc --noEmit
      - run: npm test

      - run: npx electron-vite build

      # Build first, publish second. Letting electron-builder publish makes the
      # installer and portable uploads race to create the release, which can
      # split the files across two releases with the same tag.
      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --publish never

      # Anyone can check a download against VirusTotal's scan. Pinned to v5.0.0 by commit,
      # since it's handed the API key. A failed upload doesn't stop the release: the notes
      # then leave the scan links out.
      - name: Send the exes to VirusTotal
        id: virustotal
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            release/Delegatto-Setup-*.exe
            release/Delegatto-Portable-*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCANNED: ${{ steps.virustotal.outcome == 'success' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=(
            "release/Delegatto-Setup-$version.exe"
            "release/Delegatto-Setup-$version.exe.blockmap"
            "release/Delegatto-Portable-$version.exe"
            "release/latest.yml"
          )
          # Each exe's SHA-256, and its VirusTotal page, which shows the results once the
          # scan finishes (a few minutes after the release).
          {
            echo "## Downloads"
            echo
            if [ "$SCANNED" = "true" ]; then
              echo "| File | SHA-256 | VirusTotal |"
              echo "|---|---|---|"
            else
              echo "| File | SHA-256 |"
              echo "|---|---|"
            fi
            for exe in "release/Delegatto-Setup-$version.exe" "release/Delegatto-Portable-$version.exe"; do
              hash="$(sha256sum "$exe" | cut -d' ' -f1)"
              name="$(basename "$exe")"
              if [ "$SCANNED" = "true" ]; then
                echo "| $name | \`$hash\` | [Scan results](https://www.virustotal.com/gui/file/$hash) |"
              else
                echo "| $name | \`$hash\` |"
              fi
            done
            echo
          } > release-notes.md
          cat release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "Delegatto $version" --notes-file release-notes.md --generate-notes "${files[@]}"

      # main is what visitors see, and it means "the latest release". Forward only:
      # GitHub refuses this if main has commits the release doesn't, and the run fails.
      - name: Move main to this release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$GITHUB_SHA" -F force=false --silent

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: delegatto-windows
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 7
